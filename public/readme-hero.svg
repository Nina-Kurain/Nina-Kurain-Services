<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b040c"/>
      <stop offset="40%" stop-color="#140615"/>
      <stop offset="70%" stop-color="#1a071b"/>
      <stop offset="100%" stop-color="#080209"/>
    </linearGradient>

    <!-- Rose Wine Accent Gradient -->
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e56b83"/>
      <stop offset="50%" stop-color="#ff8da3"/>
      <stop offset="100%" stop-color="#d43b60"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd280"/>
      <stop offset="50%" stop-color="#fff0c2"/>
      <stop offset="100%" stop-color="#e5a93b"/>
    </linearGradient>

    <!-- Shimmer Light Sweep Gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.12); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes shimmerMove {
        0% { transform: translateX(-1200px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .orb-1 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: 300px 150px; }
      .orb-2 { animation: pulseGlow 10s ease-in-out infinite alternate; transform-origin: 900px 320px; }
      .hero-title { font-family: 'Cinzel', 'Playfair Display', Georgia, serif; letter-spacing: 0.16em; font-weight: 800; }
      .hero-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; letter-spacing: 0.28em; font-weight: 600; text-transform: uppercase; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; }
      .beacon { animation: beaconBlink 2s ease-in-out infinite; }
      .shimmer-bar { animation: shimmerMove 6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .float-card { animation: floatSlow 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Outer Luxury Border -->
  <rect x="1.5" y="1.5" width="1197" height="477" rx="18.5" fill="none" stroke="rgba(229, 107, 131, 0.35)" stroke-width="1.5"/>
  <rect x="8" y="8" width="1184" height="464" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

  <!-- Ambient Glowing Orbs -->
  <circle cx="280" cy="140" r="160" fill="#a92f49" filter="url(#orbGlow)" class="orb-1" opacity="0.45"/>
  <circle cx="920" cy="300" r="180" fill="#6d1b38" filter="url(#orbGlow)" class="orb-2" opacity="0.4"/>
  <circle cx="600" cy="420" r="140" fill="#e56b83" filter="url(#orbGlow)" opacity="0.25"/>

  <!-- Subtle Radial Grid Pattern Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
    <line x1="1000" y1="0" x2="1000" y2="480"/>
  </g>

  <!-- Top Status Pill -->
  <g transform="translate(435, 42)">
    <rect width="330" height="34" rx="17" fill="rgba(255, 45, 117, 0.08)" stroke="rgba(229, 107, 131, 0.4)" stroke-width="1"/>
    <circle cx="22" cy="17" r="4.5" fill="#4ade80" class="beacon"/>
    <circle cx="22" cy="17" r="8" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
    <text x="38" y="21.5" fill="#f7e6ef" class="pill-text" font-size="12">CLOUDFLARE EDGE PRODUCTION ONLINE</text>
  </g>

  <!-- Main Hero Brand Typography -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Subtitle Kicker -->
    <text y="0" fill="#dfb15b" class="hero-sub" font-size="14" letter-spacing="0.32em">✦ PRIVATE CREATOR MEMBERSHIP SUITE ✦</text>

    <!-- Main Title with Rose Wine Gradient -->
    <text y="68" fill="url(#roseAccent)" class="hero-title" font-size="58" filter="drop-shadow(0 4px 18px rgba(229, 107, 131, 0.5))">NINA KURAIN</text>

    <!-- Editorial Tagline -->
    <text y="112" fill="#d1b1c2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="300" letter-spacing="0.04em">
      Exclusive VIP Boudoir Vault • Edge-Native V8 Architecture • Instant Custom UPI QR
    </text>
  </g>

  <!-- Feature Featurettes Badge Row -->
  <g transform="translate(100, 310)">
    <!-- Pill 1: Cloudflare D1 -->
    <g transform="translate(0, 0)">
      <rect width="220" height="46" rx="10" fill="url(#cardGrad)" stroke="rgba(229, 107, 131, 0.3)" stroke-width="1"/>
      <circle cx="28" cy="23" r="10" fill="#f38020" opacity="0.2"/>
      <text x="28" y="27" text-anchor="middle" font-size="13">⚡</text>
      <text x="48" y="22" fill="#ffffff" class="pill-text" font-size="13">Cloudflare Workers</text>
      <text x="48" y="36" fill="#a88e9c" font-family="sans-serif" font-size="10.5">0ms Cold Start Edge</text>
    </g>

    <!-- Pill 2: Custom UPI & Razorpay -->
    <g transform="translate(260, 0)">
      <rect width="220" height="46" rx="10" fill="url(#cardGrad)" stroke="rgba(229, 107, 131, 0.3)" stroke-width="1"/>
      <circle cx="28" cy="23" r="10" fill="#4ade80" opacity="0.2"/>
      <text x="28" y="27" text-anchor="middle" font-size="13">💳</text>
      <text x="48" y="22" fill="#ffffff" class="pill-text" font-size="13">Dynamic UPI &amp; Cards</text>
      <text x="48" y="36" fill="#a88e9c" font-family="sans-serif" font-size="10.5">0% NPCI QR + Razorpay</text>
    </g>

    <!-- Pill 3: Nina Studio Editor -->
    <g transform="translate(520, 0)">
      <rect width="220" height="46" rx="10" fill="url(#cardGrad)" stroke="rgba(229, 107, 131, 0.3)" stroke-width="1"/>
      <circle cx="28" cy="23" r="10" fill="#e56b83" opacity="0.2"/>
      <text x="28" y="27" text-anchor="middle" font-size="13">🎨</text>
      <text x="48" y="22" fill="#ffffff" class="pill-text" font-size="13">Studio Photo &amp; Reel</text>
      <text x="48" y="36" fill="#a88e9c" font-family="sans-serif" font-size="10.5">18 Tone Filters + Video</text>
    </g>

    <!-- Pill 4: D1 Storage & Quota -->
    <g transform="translate(780, 0)">
      <rect width="220" height="46" rx="10" fill="url(#cardGrad)" stroke="rgba(229, 107, 131, 0.3)" stroke-width="1"/>
      <circle cx="28" cy="23" r="10" fill="#38bdf8" opacity="0.2"/>
      <text x="28" y="27" text-anchor="middle" font-size="13">💾</text>
      <text x="48" y="22" fill="#ffffff" class="pill-text" font-size="13">D1 Storage Telemetry</text>
      <text x="48" y="36" fill="#a88e9c" font-family="sans-serif" font-size="10.5">1-Click Smart Cleaner</text>
    </g>
  </g>

  <!-- Bottom Interactive Bar / Metric Highlights -->
  <g transform="translate(100, 395)">
    <rect width="1000" height="52" rx="12" fill="rgba(0, 0, 0, 0.45)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Stat 1 -->
    <text x="120" y="24" fill="#a88e9c" font-family="sans-serif" font-size="11" text-anchor="middle" text-transform="uppercase">DATABASE QUOTA</text>
    <text x="120" y="42" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">500 MB SQLite D1</text>

    <line x1="250" y1="12" x2="250" y2="40" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <!-- Stat 2 -->
    <text x="375" y="24" fill="#a88e9c" font-family="sans-serif" font-size="11" text-anchor="middle" text-transform="uppercase">CUSTOM PAYMENTS</text>
    <text x="375" y="42" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Any Amount Rupee QR</text>

    <line x1="500" y1="12" x2="500" y2="40" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <!-- Stat 3 -->
    <text x="625" y="24" fill="#a88e9c" font-family="sans-serif" font-size="11" text-anchor="middle" text-transform="uppercase">REFERRAL ENGINE</text>
    <text x="625" y="42" fill="#ff9cb3" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">7-Day Reward Clock</text>

    <line x1="750" y1="12" x2="750" y2="40" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <!-- Stat 4 -->
    <text x="875" y="24" fill="#a88e9c" font-family="sans-serif" font-size="11" text-anchor="middle" text-transform="uppercase">PRIVATE STORAGE</text>
    <text x="875" y="42" fill="#dfb15b" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Google Drive OAuth 2.0</text>
  </g>
</svg>
