plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ninakurain.services'
    compileSdk 34

    defaultConfig {
        applicationId "com.ninakurain.services"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "2.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions = ["userType"]
    productFlavors {
        member {
            dimension "userType"
            applicationId "com.ninakurain.services"
            manifestPlaceholders = [appName: "Nina Kurain VIP"]
            buildConfigField "String", "TARGET_URL", "\"https://vip.ninakurainservices.in/login\""
        }
        admin {
            dimension "userType"
            applicationId "com.ninakurain.studio"
            manifestPlaceholders = [appName: "Nina Studio"]
            buildConfigField "String", "TARGET_URL", "\"https://vip.ninakurainservices.in/admin/login\""
        }
    }

    signingConfigs {
        release {
            storeFile file("release-key.jks")
            storePassword "ninakurain123"
            keyAlias "ninakurain"
            keyPassword "ninakurain123"
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
    // Rename the generated APK aesthetically
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def flavor = variant.flavorName ?: ""
            def name = flavor == "admin" ? "NinaKurain_Studio_release.apk" : "NinaKurain_VIP_release.apk"
            outputFileName = name
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
